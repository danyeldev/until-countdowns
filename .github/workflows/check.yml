name: Check
on:
  pull_request:
  push:
    branches: [main]
  # Vercel's GitHub integration reports each deployment; the Lighthouse job
  # keys off the production one so it audits the build that just went live
  # instead of racing the deploy on push.
  deployment_status:
permissions:
  contents: read
concurrency:
  group: check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      INGEST_ENABLED: "false"
      CATALOG_PRERENDER_LIMIT: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:sql
      - run: npm run build
  lighthouse:
    if: >-
      github.event_name == 'deployment_status'
      && github.event.deployment_status.state == 'success'
      && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: treosh/lighthouse-ci-action@12.6.1
        with:
          urls: |
            https://until.day/
          # Three runs so a single noisy simulated-mobile pass cannot fail the budget.
          runs: 3
          budgetPath: .github/lighthouse/budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true
